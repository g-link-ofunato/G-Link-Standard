<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>G-Link Standard エリア選択</title>
 
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="style.css?v=Build1437"/>
  <link rel="stylesheet" href="license-auth.css?v=Build1445" />
</head>
 
<body>
 
<div id="toolbar">
 
  <div class="toolItem">
    <label>縮尺</label>
    <div id="currentScale" class="scaleReadout">縮尺：約1/-</div>
  </div>
 
  <div class="toolItem">
    <label>サイズ</label>
    <select id="paper">
      <option value="A0">極大</option>
      <option value="A1">大</option>
      <option value="A2" selected>中</option>
      <option value="A3">小</option>
      <option value="A4">極小</option>
    </select>
  </div>
 
  <div class="toolItem">
    <label>向き</label>
    <select id="orientation">
      <option value="portrait">タテ</option>
      <option value="landscape" selected>ヨコ</option>
    </select>
  </div>
 
  <div class="toolItem">
    <label>グリッド</label>
    <select id="grid">
      <option value="0" selected>無し</option>
      <option value="5">5m</option>
      <option value="10">10m</option>
      <option value="50">50m</option>
      <option value="100">100m</option>
      <option value="200">200m</option>
      <option value="300">300m</option>
      <option value="500">500m</option>
      <option value="1000">1000m</option>
    </select>
  </div>
 
  <div class="toolItem">
    <label>地図種類</label>
    <select id="mapType">
      <option value="pale" selected>淡色地図</option>
      <option value="std">標準地図</option>
      <option value="photo">写真</option>
      <option value="relief">色別標高図</option>
      <option value="hillshade">陰影起伏図</option>
    </select>
  </div>
 
  <div class="toolItem searchItem">
    <label>名称・住所検索</label>
    <div class="searchRow">
      <input id="searchBox" type="text" placeholder="地名・施設名・住所を入力してください">
      <button id="searchBtn">検索</button>
    </div>
  </div>

  <div class="toolItem searchItem coordinateSearchItem">
    <label>座標検索</label>
    <div class="areaCoordinateCompact">
      <div class="areaCoordinateSearchMode" role="group" aria-label="座標入力形式">
        <button type="button" id="areaCoordModeDmsBtn" class="areaCoordModeBtn active">度分秒</button>
        <button type="button" id="areaCoordModeDecimalBtn" class="areaCoordModeBtn">10進法</button>
      </div>
      <div class="areaCoordinateFields">
    <div id="areaCoordDmsInputs" class="areaCoordInputs">
      <label class="areaCoordInputLine">
        <span>緯度</span>
        <input id="areaCoordLatDmsInput" class="areaCoordMaskedInput" type="text" inputmode="numeric" autocomplete="off" value="00度00分00.00秒" aria-label="緯度 度分秒">
      </label>
      <label class="areaCoordInputLine areaCoordInputLineWithAction">
        <span>経度</span>
        <input id="areaCoordLngDmsInput" class="areaCoordMaskedInput" type="text" inputmode="numeric" autocomplete="off" value="000度00分00.00秒" aria-label="経度 度分秒">
        <button id="coordinateSearchBtn" class="areaCoordSearchAction">検索</button>
      </label>
    </div>
    <div id="areaCoordDecimalInputs" class="areaCoordInputs" hidden>
      <label class="areaCoordInputLine">
        <span>緯度</span>
        <input id="areaCoordLatDecimalInput" type="text" inputmode="decimal" placeholder="例：39.070094">
      </label>
      <label class="areaCoordInputLine">
        <span>経度</span>
        <input id="areaCoordLngDecimalInput" type="text" inputmode="decimal" placeholder="例：141.709600">
      </label>
    </div>
      </div>
    </div>
  </div>
 
 
  <div class="toolItem commitItem">
    <button id="commitSessionBtn">この範囲で確定</button>
  </div>
 
</div>
 
<div id="map"></div>
<div id="printFrame"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js?v=Build1437"></script>
 
  <script src="license-auth.js?v=Build1445"></script>
</body>
</html>
